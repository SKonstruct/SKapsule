name: Build APK

# Full from-source build: compiles every native submodule (gl4es, openal, lwjgl3,
# cacio, frenchpress), stages them, then assembles + signs the release APK.
#
# Signing is optional. To produce a *signed* app-release.apk, set these repo secrets
# (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    - `base64 -w0 sk-release.jks` (the whole keystore, base64)
#   KEYSTORE_PASSWORD  - keystore password
#   KEY_ALIAS          - key alias inside the keystore (e.g. sk)
#   KEY_PASSWORD       - key password
# With no secrets set, the build still succeeds and uploads app-release-unsigned.apk
# (build.gradle.kts degrades gracefully). NOTE: GitHub secrets are write-only — they
# are NOT a recoverable backup of your keystore. Keep your own copy of sk-release.jks.

# Manual only (Actions -> Build APK -> Run workflow): nothing builds on a push or a tag. Called with
# a version by release-apk.yml, which makes it also publish a GitHub Release: that
# is the only way a release happens, so the tag is created after a successful build and a
# failed build leaves nothing behind to clean up.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to release, without the leading v. Empty builds only.
        type: string
        default: ""
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

permissions:
  contents: write # creates the release and its tag

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      # Must match launcher/app/build.gradle.kts ndkVersion + cmake version.
      # NDK 30 (Clang 20): NDK 27's Clang 18 miscompiles openal-soft's C++20 ranges.
      NDK_VERSION: "30.0.14904198"
      CMAKE_VERSION: "3.22.1"

    steps:
      # Everything a release needs is checked before the long build: a bad version, a missing
      # changelog section, an unsigned build or an already-used tag fail in seconds.
      - name: Check release preconditions
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Version must look like 1.2.3, without a leading v."
          [ "$GITHUB_REF" = refs/heads/main ] || fail "Releases are made from main."
          [ -n "$KEYSTORE_BASE64" ] || fail "KEYSTORE_BASE64 is not set: a release must be signed."
          # The versionCode comes from the version, so a version that does not go up is an APK
          # Android refuses to install over the last one.
          latest=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "${latest#v}" "$VERSION" | sort -V | tail -1)" = "$VERSION" ] \
            || fail "Version $VERSION must be newer than the latest release ($latest)."
          ! gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || fail "Release v$VERSION already exists."
          ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1 \
            || fail "Tag v$VERSION already exists without a release. Delete it (git push origin :refs/tags/v$VERSION) or pick a new version."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # The release notes are this version's CHANGELOG.md section, followed by GitHub's
      # generated notes.
      - name: Extract changelog section
        if: env.VERSION != ''
        run: |
          awk -v h="## $VERSION" '$0==h{f=1;next} /^## /{f=0} f' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md" || { echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; }

      # Two JDKs are needed: 8 for LWJGL's Java-8 multi-release layer (rt.jar), and
      # 25 for everything else — Gradle/AGP (Gradle 9 runs on JDK 25), the bootstrap
      # module, and cacio + frenchpress (their poms compile --release 25). setup-java
      # exports JAVA_HOME_<v>_X64 for each.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "8" }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: zulu, java-version: "25", cache: gradle } # zulu 25 matches the dev box

      - name: Install native build tools (ant for LWJGL, ninja/zip for the scripts)
        run: sudo apt-get update && sudo apt-get install -y ant ninja-build zip

      - name: Install matching NDK + CMake via sdkmanager
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # Cache the heavy native outputs, keyed on the submodule commit set + the build
      # scripts. On a hit we skip the whole native rebuild and just restore out/.
      - name: Compute submodule cache key
        id: submods
        run: echo "sha=$(git submodule status --recursive | awk '{print $1}' | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache native build outputs
        id: cache-out
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: out
          key: native-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-${{ steps.submods.outputs.sha }}-${{ hashFiles('scripts/build-*.sh') }}

      - name: Build native submodules (cache miss only)
        if: steps.cache-out.outputs.cache-hit != 'true'
        env:
          JAVA8_HOME: ${{ env.JAVA_HOME_8_X64 }}
          CACIO_JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
          FRENCHPRESS_JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }} # LWJGL ant build runs under 25 (matches dev box)
        run: |
          ./scripts/build-gl4es-android.sh
          ./scripts/build-openal-android.sh
          ./scripts/build-lwjgl3-android.sh
          ./scripts/build-cacio-android.sh
          ./scripts/build-frenchpress-android.sh

      - name: Stage assets into the launcher
        run: ./scripts/stage-launcher-assets.sh

      # Decode the keystore from the secret if present; otherwise leave SK_KEYSTORE_FILE
      # empty and the build produces an unsigned APK.
      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sk-release.jks"
            echo "file=$RUNNER_TEMP/sk-release.jks" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded; APK will be signed."
          else
            echo "No KEYSTORE_BASE64 secret set; APK will be UNSIGNED."
          fi

      - name: Determine Version Name
        id: version
        run: |
          if [ -n "$VERSION" ]; then
            NAME="$VERSION"
          else
            NAME=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            NAME="${NAME#v}"
          fi
          echo "VERSION=$NAME" >> "$GITHUB_OUTPUT"
          echo "SK_VERSION_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Assemble release APK
        working-directory: launcher
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }} # Gradle 9 runs on JDK 25
          SK_VERSION_NAME: ${{ env.SK_VERSION_NAME }}
          SK_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          SK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # The signing step is the only user of the keystore; gone before any third-party action runs.
      - name: Remove the release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sk-release.jks"

      # Creates the tag at the built commit together with the release, so a tag exists only
      # for a release that was actually published and signed.
      - name: Publish GitHub Release
        if: env.VERSION != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: launcher/app/build/outputs/apk/release/skapsule-v${{ env.VERSION }}.apk
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload APK
        if: env.VERSION == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skapsule-release-apk
          path: launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
