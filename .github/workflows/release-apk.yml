name: Release APK

# Manual: Actions -> Release APK -> Run workflow. Builds and signs the APK from main and, only
# if that succeeds, creates the tag and the GitHub Release (notes from CHANGELOG.md). Nothing is
# created on failure, so just run it again; there is no version to burn.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. X.Y.Z (CHANGELOG.md needs a '## X.Y.Z' section)"
        required: true
        type: string

concurrency: release

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/build-apk.yml
    with:
      version: ${{ inputs.version }}
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    permissions:
      contents: write
